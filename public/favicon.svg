<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#4f46e5"/>

  <!-- car: bold solid silhouette, top half -->
  <g fill="#ffffff">
    <rect x="20" y="9" width="20" height="10" rx="3"/>
    <rect x="11" y="17" width="38" height="12" rx="4"/>
    <circle cx="20" cy="31" r="5"/>
    <circle cx="44" cy="31" r="5"/>
  </g>

  <!-- bike: bold outline, bottom half -->
  <g fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="17" cy="52" r="6.5"/>
    <circle cx="47" cy="52" r="6.5"/>
    <path d="M17 52 30 38 47 52"/>
  </g>
</svg>
